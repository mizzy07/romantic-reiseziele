<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nicht gefunden — Für Maryem ♥</title>
    <meta name="theme-color" content="#0d0717" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e85a8c'%3E%3Cpath d='M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&amp;family=Dancing+Script:wght@600;700&amp;family=Playfair+Display:wght@500&amp;display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: 'Cormorant Garamond', Georgia, serif;
        background: radial-gradient(80% 60% at 30% 20%, #2a0a3a 0%, transparent 60%),
                    radial-gradient(80% 60% at 70% 80%, #4a1530 0%, transparent 60%),
                    #0d0717;
        color: #fde9b9;
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 32px 20px;
        text-align: center;
      }
      .wrap { max-width: 540px; }
      .heart {
        font-size: 64px;
        color: #e85a8c;
        animation: pulse 1.6s ease-in-out infinite;
      }
      h1 {
        font-family: 'Dancing Script', cursive;
        font-size: 56px;
        margin: 16px 0 8px;
        background: linear-gradient(135deg, #fde9b9, #d4a843);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .sub {
        font-family: 'Playfair Display', serif;
        font-size: 22px;
        color: #fde9b9;
        margin-bottom: 22px;
      }
      p {
        font-style: italic;
        font-size: 19px;
        line-height: 1.55;
        color: rgba(253, 233, 185, 0.85);
        margin-bottom: 28px;
      }
      a.cta {
        display: inline-block;
        background: linear-gradient(135deg, #e85a8c, #d4a843);
        color: #fff;
        text-decoration: none;
        padding: 14px 32px;
        border-radius: 999px;
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 18px;
        font-weight: 600;
        box-shadow: 0 12px 28px -8px rgba(232, 90, 140, 0.55);
        transition: transform 0.2s;
      }
      a.cta:hover { transform: translateY(-2px); }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
      @media (prefers-reduced-motion: reduce) {
        .heart { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="heart" aria-hidden="true">♥</div>
      <h1>Habibti, hier ist nichts</h1>
      <div class="sub">Aber überall sonst — alles für dich.</div>
      <p>Diese Seite gibt es nicht. Vielleicht ein Tippfehler, vielleicht hat sie sich versteckt. Komm zurück zum Geschenk.</p>
      <a class="cta" href="/">← Zurück zu uns</a>
    </main>
  </body>
</html>
